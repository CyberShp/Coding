name: Windows portable package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: observation_web/frontend/package-lock.json
      - name: Build and validate portable ZIP
        shell: pwsh
        run: ./observation_web/scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: observation-platform-windows-x64
          path: |
            observation_web/dist/*.zip
            observation_web/dist/*.sha256
          if-no-files-found: error
          retention-days: 30
